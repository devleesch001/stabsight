# stabsight - Configuration Example
# Operational settings (can be overridden by CLI flags and INTERNET_MONITOR_* environment variables)
log_level: "info"
log_format: "json" # Log format: "json" (structured) or "common" (human-readable console)
histogram_mode: "exponential" # "explicit" (for standard Prometheus buckets) or "exponential" (OTel native)
# Optional: custom bucket boundaries in seconds (default: 0.5ms to 10s)
# histogram_buckets: [0.0005, 0.001, 0.0025, 0.005, 0.010, 0.025, 0.050, 0.100, 0.250, 0.500, 1.0, 2.5, 5.0, 10.0]

metrics_addr: ":6967"
otlp_endpoint: "http://localhost:4318"

# Network targets (strictly defined in this YAML file, never via flags or env vars)
targets:
  - name: "google-dns"
    host: "8.8.8.8"
    ip_version: "ipv4"
    probes:
      icmp:
        interval: 1s
        timeout: 1s
        count: 1
      dns:
        interval: 5s
        timeout: 2s
        server: "8.8.8.8:53"
        record_type: "A"

  - name: "cloudflare-dns"
    host: "1.1.1.1"
    ip_version: "ipv4"
    probes:
      icmp:
        interval: 1s
        timeout: 1s
        count: 1

  - name: "example-http"
    host: "example.com"
    ip_version: "ipv4"
    probes:
      http:
        interval: 10s
        timeout: 5s
        url: "https://example.com"
        method: "GET"
        expected_code: 200
        tls_skip_verify: false
      tcp:
        interval: 5s
        timeout: 2s
        port: 443

  - name: "route-diagnostics"
    host: "1.1.1.1"
    ip_version: "ipv4"
    probes:
      mtr:
        interval: 60s
        timeout: 5s
        max_hops: 30

  - name: "isp-bandwidth"
    host: "speedtest"
    probes:
      speedtest:
        interval: 30m
        timeout: 60s
