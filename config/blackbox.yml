modules:
  icmp_ipv4:
    prober: icmp
    timeout: 1s
    icmp:
      preferred_ip_protocol: "ip4"

  http_example:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      method: "GET"
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false

  tcp_443:
    prober: tcp
    timeout: 2s
    tcp:
      preferred_ip_protocol: "ip4"

  dns_a_record:
    prober: dns
    timeout: 2s
    dns:
      query_name: "google.com"
      query_type: "A"
      preferred_ip_protocol: "ip4"