receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318" # Écoute ton app Node
  prometheus/blackbox:
    config:
      scrape_configs:
        # Scrape ICMP
        - job_name: 'blackbox_icmp'
          metrics_path: /probe
          scrape_interval: 1s
          params:
            module: [icmp_ipv4] # Le module défini dans ton blackbox.yml
          static_configs:
            - targets:
                - 8.8.8.8      # google-dns
                - 1.1.1.1      # cloudflare-dns
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox-exporter:9115 # L'URL de ton conteneur Blackbox Exporter

        # Scrape HTTP
        - job_name: 'blackbox_http'
          metrics_path: /probe
          scrape_interval: 10s
          params:
            module: [http_example]
          static_configs:
            - targets:
                - https://example.com
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox-exporter:9115

exporters:
  debug:
    verbosity: detailed
  prometheus_remote_write:
    endpoint: "http://prometheus:9090/api/v1/write"

processors:
  batch: # Optimise l'envoi des données en lots

service:
  pipelines:
    metrics:
      receivers: [ otlp, prometheus/blackbox ]
      processors: [ batch ]
      exporters: [ prometheus_remote_write, debug ]
